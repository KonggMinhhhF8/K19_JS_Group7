<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quản Lý Sản Phẩm | ShopAdmin</title>
  <link rel="stylesheet" href="./styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
<div class="container">
  <aside class="sidebar" id="sidebar"></aside>

  <main class="main-content">
    <header>
      <div class="search-bar">
        <label for="searchInput"></label>
        <input type="text" id="searchInput" placeholder="Tìm tên sản phẩm, mã SKU...">
      </div>
      <div class="user-actions">
        <button class="btn-add" id="btnAddProduct">Thêm sản phẩm</button>
      </div>
    </header>

    <section class="stats" id="product-Stats">
    </section>
    <section class="table-container">
      <div class="table-header">
        <h3>Danh mục sản phẩm</h3>
        <div class="filters">
          <label>
            <select>
              <option>Tất cả danh mục</option>
              <option>Điện thoại</option>
              <option>Phụ kiện</option>
            </select>
          </label>
        </div>
      </div>
      <table id="productTable">
        <thead>
        </thead>
        <tbody id="productTableBody">
        </tbody>
      </table>
    </section>
  </main>
</div>
<div id="productModal" class="modal" style="display: none">
  <div class="modal-content">
    <h3 id="modalTitle">Thêm sản phẩm mới</h3>
    <form id="productForm">
      <input type="hidden" id="inputId">

      <input type="text" id="inputName" placeholder="Tên sản phẩm" required>
      <input type="text" id="inputSku" placeholder="Mã SKU" required>
      <input type="number" id="inputPrice" placeholder="Giá bán" required>
      <input type="number" id="inputStock" placeholder="Số lượng tồn kho" required>

      <select id="inputCategory" required>
        <option value="">-- Chọn danh mục --</option>
      </select>

      <!-- NEW: vùng upload ảnh -->
      <div class="form-group">
        <label>Hình ảnh sản phẩm</label>
        <div class="image-upload" onclick="document.getElementById('modalFileInput').click()">
          <i class="fas fa-cloud-upload-alt"></i>
          <p>Nhấp để tải ảnh lên</p>
          <input type="file" id="modalFileInput" accept="image/*" hidden>
          <img id="modalImgPreview" class="preview-img" src="#" alt="Preview" style="display:none; max-width:120px; margin-top:8px;">
        </div>
      </div>
      <!-- END NEW -->

      <div class="modal-buttons">
        <button type="button" class="btn-cancel">Hủy</button>
        <button type="submit" class="btn-add" id="btnSaveProduct">Lưu sản phẩm</button>
      </div>
    </form>
  </div>
</div>

<script type="module" src="./products.js"></script>
</body>
</html>
