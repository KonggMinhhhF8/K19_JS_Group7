<!doctype html>
<html lang="vi">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Quản Lý Khách Hàng | ShopAdmin</title>
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
        />
        <link rel="stylesheet" href="./index.css" />
    </head>
    <body>
        <div class="container">
            <aside class="sidebar">
                <h2>ShopAdmin</h2>
                <ul>
                    <li>
                        <a href="../index.html">
                            <i class="fas fa-home"></i>
                            Tổng quan
                        </a>
                    </li>
                    <li><i class="fas fa-box"></i> Sản phẩm</li>
                    <li><i class="fas fa-shopping-cart"></i> Đơn hàng</li>
                    <li class="active">
                        <i class="fas fa-users"></i> Khách hàng
                    </li>
                    <li><i class="fas fa-chart-line"></i> Báo cáo</li>
                </ul>
            </aside>

            <main class="main-content">
                <header>
                    <div class="search-bar">
                        <input
                            type="text"
                            id="search"
                            onkeyup="searchCustomer()"
                            placeholder="Tìm tên, email hoặc số điện thoại"
                        />
                    </div>
                    <button class="btn-add" onclick="openModal()">
                        <i class="fas fa-user-plus"></i> Thêm khách hàng
                    </button>
                </header>

                <section class="stats">
                    <div class="card">
                        <h3>Tổng khách hàng</h3>
                        <p>850</p>
                    </div>
                    <div class="card">
                        <h3>Khách hàng mới (Tháng)</h3>
                        <p>42</p>
                    </div>
                    <div class="card">
                        <h3>Tỉ lệ quay lại</h3>
                        <p>65%</p>
                    </div>
                </section>

                <section class="table-container">
                    <div class="table-header">
                        <h3>Danh sách khách hàng</h3>
                        <select
                            style="
                                padding: 8px;
                                border-radius: 5px;
                                border: 1px solid #ddd;
                            "
                        >
                            <option>Hạng: Tất cả</option>
                            <option>Hạng: Vàng</option>
                            <option>Hạng: Bạc</option>
                        </select>
                    </div>
                    <table>
                        <thead>
                            <tr>
                                <th>Khách hàng</th>
                                <th>Liên hệ</th>
                                <th>Hạng</th>
                                <th>Đơn hàng</th>
                                <th>Tổng chi tiêu</th>
                                <th>Thao tác</th>
                            </tr>
                        </thead>
                        <tbody id="customerTableBody"></tbody>
                    </table>
                </section>
            </main>
        </div>

        <!-- Modal thêm khách hàng -->
        <div id="modal" class="modal-overlay">
            <div class="customer-modal">
                <div class="modal-header">
                    <h3>Thêm khách hàng</h3>
                    <button class="modal-close" onclick="closeModal()">
                        <i class="fas fa-times"></i>
                    </button>
                </div>

                <div class="modal-form">
                    <input id="name" placeholder="Tên khách hàng" />
                    <input id="email" placeholder="Email" />
                    <input id="phone" placeholder="Số điện thoại" />

                    <select id="tier">
                        <option value="gold">Vàng</option>
                        <option value="silver">Bạc</option>
                        <option value="bronze">Đồng</option>
                    </select>
                </div>

                <div class="modal-actions">
                    <button class="btn-cancel" onclick="closeModal()">
                        Hủy
                    </button>
                    <button class="btn-save" onclick="addCustomer()">
                        Lưu khách hàng
                    </button>
                </div>
            </div>
        </div>

        <script src="./index.js"></script>
    </body>
</html>
